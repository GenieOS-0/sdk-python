[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "mailgenius"
version = "0.1.0"
description = "Official Python SDK for MailGenius — sync + async clients, typed responses, idempotency-aware retries, webhook verification."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "MailGenius", email = "developers@mailgenius.app" }]
requires-python = ">=3.9"
keywords = ["mailgenius", "email", "transactional", "drip", "sequences", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://mailgenius.app/developers"
Documentation = "https://docs.mailgenius.app/sdks/python"
Repository = "https://github.com/mail-genius/mailgenius"
Issues = "https://github.com/mail-genius/mailgenius/issues"
Changelog = "https://github.com/mail-genius/mailgenius/blob/main/packages/sdk-python/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mailgenius"]

[tool.hatch.build.targets.sdist]
include = ["src/mailgenius", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.9"
