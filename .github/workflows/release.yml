name: Release

# Tag-driven publish for the `mailgenius` Python SDK to PyPI.
#
#   git tag v0.1.1
#   git push origin v0.1.1
#
# The tag value should match the `version` field in pyproject.toml. Uses
# PyPI Trusted Publishing (OIDC) — configure the publisher at:
#   https://pypi.org/manage/project/mailgenius/settings/publishing/
# with workflow filename `release.yml`, environment left blank.

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write    # required for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify tag matches pyproject.toml version
        run: |
          PKG_VERSION=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match pyproject.toml v$PKG_VERSION"
            exit 1
          fi

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist + wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
